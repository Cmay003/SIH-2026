<text x="48" y="145" fill="#1b1b1b">GPIO23</text>
<text x="232" y="145" text-anchor="end" font-size="11" fill="#5f6b60">LORA_MOSI</text>
<line x1="240" y1="141" x2="470" y2="141" stroke="#37474f" stroke-width="1.6"/>
