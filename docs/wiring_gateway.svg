<text x="480" y="355" fill="#1b1b1b">LED</text>
<rect x="40" y="388" width="12" height="12" fill="none" stroke="#c62828" stroke-width="2"/>
<text x="58" y="398" font-size="11.5" fill="#37474f">powered from 3.3 V</text>
<rect x="190" y="388" width="12" height="12" fill="none" stroke="#e65100" stroke-width="2"/>
<text x="208" y="398" font-size="11.5" fill="#37474f">powered from 5 V</text>
<rect x="340" y="388" width="12" height="12" fill="none" stroke="#6a1b9a" stroke-width="2"/>
<text x="358" y="398" font-size="11.5" fill="#37474f">own supply</text>
<rect x="490" y="388" width="12" height="12" fill="none" stroke="#546e7a" stroke-width="2"/>
