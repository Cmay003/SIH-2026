<circle cx="1100" cy="627" r="4.5" fill="#263238"/>
<polyline points="140,440 140,627" fill="none" stroke="#263238" stroke-width="2.6" stroke-linejoin="round"/>
<circle cx="140" cy="627" r="4.5" fill="#263238"/>
<polyline points="320,587 320,627" fill="none" stroke="#263238" stroke-width="2.6" stroke-linejoin="round"/>
<circle cx="320" cy="627" r="4.5" fill="#263238"/>
<circle cx="565" cy="268" r="4.5" fill="#263238"/>
<text x="40" y="647" font-size="12" text-anchor="start" font-weight="bold" fill="#263238">common GND: TP4056 IN− / OUT−, MT3608 VIN− / VOUT−, ESP32 GND, every module, the divider bottom, own supplies (−)</text>
<line x1="40" y1="675" x2="66" y2="675" stroke="#b8860b" stroke-width="3"/>
<text x="72" y="679" font-size="11.5" text-anchor="start" fill="#37474f">panel</text>
<line x1="116.0" y1="675" x2="142.0" y2="675" stroke="#00838f" stroke-width="3"/>
<text x="148.0" y="679" font-size="11.5" text-anchor="start" fill="#37474f">cell + (B+ = OUT+)</text>
<line x1="275.2" y1="675" x2="301.2" y2="675" stroke="#e65100" stroke-width="3"/>
<text x="307.2" y="679" font-size="11.5" text-anchor="start" fill="#37474f">5 V</text>
<line x1="338.4" y1="675" x2="364.4" y2="675" stroke="#c62828" stroke-width="3"/>
<text x="370.4" y="679" font-size="11.5" text-anchor="start" fill="#37474f">3.3 V</text>
<line x1="414.4" y1="675" x2="440.4" y2="675" stroke="#6a1b9a" stroke-width="3"/>
<text x="446.4" y="679" font-size="11.5" text-anchor="start" fill="#37474f">own supply</text>
<line x1="522.4" y1="675" x2="548.4" y2="675" stroke="#263238" stroke-width="3"/>
<text x="554.4" y="679" font-size="11.5" text-anchor="start" fill="#37474f">GND</text>
<circle cx="591.6" cy="675" r="4.5" fill="#263238"/>
<text x="601.6" y="679" font-size="11.5" text-anchor="start" fill="#37474f">= wires joined (crossing wires without a dot are not)</text>
<text x="40" y="701" font-size="11.5" text-anchor="start" fill="#5f6b60">ESP32 DevKit: power it from ONE source only (Espressif) - disconnect the MT3608 before plugging in USB.</text>
<text x="40" y="718" font-size="11.5" text-anchor="start" fill="#5f6b60">Currents and panel size are typical/estimated values - MEASURE your build (see wiring.html, power budget).</text>
