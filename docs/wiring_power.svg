<polyline points="1110,230 1190,230 1190,380" fill="none" stroke="#c62828" stroke-width="2.6" stroke-linejoin="round"/>
<text x="255" y="222" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#b8860b">PV+</text>
<text x="565" y="222" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#00838f">BAT+</text>
<text x="850" y="222" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#e65100">5.0 V</text>
<text x="1150" y="222" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#c62828">3.3 V</text>
<polyline points="210,268 300,268" fill="none" stroke="#263238" stroke-width="2.6" stroke-linejoin="round"/>
<polyline points="520,268 610,268" fill="none" stroke="#263238" stroke-width="2.6" stroke-linejoin="round"/>
<polyline points="820,268 930,268" fill="none" stroke="#263238" stroke-width="2.6" stroke-linejoin="round"/>
<path d="M890,230 L890,260 A8,8 0 0 1 890,276 L890,380" fill="none" stroke="#e65100" stroke-width="2.6"/>
<circle cx="890" cy="230" r="4.5" fill="#e65100"/>
<rect x="620" y="380" width="290" height="124" rx="8" fill="#ffffff" stroke="#e65100" stroke-width="2"/>
<text x="632" y="402" font-size="13" text-anchor="start" font-weight="bold" fill="#e65100">5 V rail (MT3608 VOUT+) → VCC of</text>
<text x="636" y="422" font-size="12" text-anchor="start" fill="#1b1b1b">• HC-SR04 water level</text>
<text x="636" y="440" font-size="12" text-anchor="start" fill="#1b1b1b">• MQ135 gas</text>
<text x="636" y="458" font-size="12" text-anchor="start" fill="#1b1b1b">• PMS5003 particulate</text>
<text x="636" y="476" font-size="12" text-anchor="start" fill="#1b1b1b">• pH board (PH-4502C)</text>
<text x="636" y="494" font-size="12" text-anchor="start" fill="#1b1b1b">• Turbidity (SEN0189)</text>
<rect x="950" y="380" width="300" height="124" rx="8" fill="#ffffff" stroke="#c62828" stroke-width="2"/>
<text x="962" y="402" font-size="13" text-anchor="start" font-weight="bold" fill="#c62828">3.3 V rail (ESP32 3V3 pin) → VCC of</text>
<text x="966" y="422" font-size="12" text-anchor="start" fill="#1b1b1b">• SX1278 LoRa (Ra-02)</text>
<text x="966" y="440" font-size="12" text-anchor="start" fill="#1b1b1b">• DHT22 temp/humidity</text>
<text x="966" y="458" font-size="12" text-anchor="start" fill="#1b1b1b">• IR flame sensor</text>
<text x="966" y="476" font-size="12" text-anchor="start" fill="#1b1b1b">• Capacitive soil moisture v1.2</text>
<text x="966" y="494" font-size="12" text-anchor="start" fill="#1b1b1b">• MPU6050 tilt/vibration</text>
<rect x="170" y="535" width="300" height="52" rx="8" fill="#ffffff" stroke="#6a1b9a" stroke-width="2"/>
<text x="182" y="557" font-size="13" text-anchor="start" font-weight="bold" fill="#6a1b9a">Own supply (not a board rail)</text>
<text x="186" y="577" font-size="12" text-anchor="start" fill="#1b1b1b">• Village siren + strobe (12 V)</text>
<polyline points="40,627 1250,627" fill="none" stroke="#263238" stroke-width="2.6" stroke-linejoin="round"/>
